name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barber_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barber -d barber_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://barber:barber@localhost:5432/barber_test
      TEST_DATABASE_URL: postgres://barber:barber@localhost:5432/barber_test
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migration:run
      - run: npm test
