name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging
  cancel-in-progress: false

jobs:
  stage:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: stage
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/barber-api" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:stage
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/proxy.docker-compose.yml,deploy/update-image.sh
          target: /tmp/barber-deploy
          strip_components: 1

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            mkdir -p /opt/barber/proxy /opt/barber/stage
            cp /tmp/barber-deploy/Caddyfile /opt/barber/proxy/Caddyfile
            cp /tmp/barber-deploy/proxy.docker-compose.yml /opt/barber/proxy/docker-compose.yml
            cp /tmp/barber-deploy/docker-compose.yml /opt/barber/stage/docker-compose.yml
            cp /tmp/barber-deploy/update-image.sh /opt/barber/update-image.sh
            chmod +x /opt/barber/update-image.sh
            touch /opt/barber/stage/.env
            grep -q '^CF_API_TOKEN=' /opt/barber/stage/.env \
              && sed -i 's|^CF_API_TOKEN=.*|CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}|' /opt/barber/stage/.env \
              || echo 'CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}' >> /opt/barber/stage/.env
            grep -q '^CF_ZONE_ID=' /opt/barber/stage/.env \
              && sed -i 's|^CF_ZONE_ID=.*|CF_ZONE_ID=${{ secrets.STAGE_ZONE_ID }}|' /opt/barber/stage/.env \
              || echo 'CF_ZONE_ID=${{ secrets.STAGE_ZONE_ID }}' >> /opt/barber/stage/.env
            grep -q '^SERVER_IP=' /opt/barber/stage/.env \
              && sed -i 's|^SERVER_IP=.*|SERVER_IP=${{ secrets.VPS_HOST }}|' /opt/barber/stage/.env \
              || echo 'SERVER_IP=${{ secrets.VPS_HOST }}' >> /opt/barber/stage/.env
            docker network create barber-proxy 2>/dev/null || true
            cd /opt/barber/proxy
            docker compose up -d
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose restart caddy
            /opt/barber/update-image.sh stage api "${{ steps.image.outputs.name }}:${{ github.sha }}"
