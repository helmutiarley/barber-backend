name: barber-${BARBER_ENV}

services:
  postgres:
    image: postgres:16
    container_name: barber-${BARBER_ENV}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: barber
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barber -d barber']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    image: ${API_IMAGE}
    container_name: barber-${BARBER_ENV}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://barber:${POSTGRES_PASSWORD}@postgres:5432/barber
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-America/Sao_Paulo}
      CANCELLATION_WINDOW_HOURS: ${CANCELLATION_WINDOW_HOURS:-24}
      CARD_FEE_RATE_DEBIT: ${CARD_FEE_RATE_DEBIT:-0.015}
      CARD_FEE_RATE_CREDIT: ${CARD_FEE_RATE_CREDIT:-0.035}
      # barbearia360.app in prod, barbearia360.dev in staging (set per-env).
      SHOPS_BASE_DOMAIN: ${SHOPS_BASE_DOMAIN:-barbearia360.app}
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-crm.barbearia360.app,crm.barbearia360.dev}
      # Only used when the multi-tenant migration runs against a database that
      # already has data: domain of the "default" shop that adopts those rows.
      DEFAULT_SHOP_DOMAIN: ${DEFAULT_SHOP_DOMAIN:-}
      # Cloudflare DNS automation: creates {slug}.{base} records on shop
      # creation. Empty token disables it.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      SERVER_IP: ${SERVER_IP:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - internal
      - barber-proxy

  web:
    image: ${WEB_IMAGE}
    container_name: barber-${BARBER_ENV}-web
    restart: unless-stopped
    networks:
      - internal
      - barber-proxy

  # Only started when targeted explicitly (update-image.sh <env> crm), so a
  # plain `docker compose up -d` keeps working before the CRM ever deployed.
  crm:
    image: ${CRM_IMAGE:-crm-image-not-configured}
    container_name: barber-${BARBER_ENV}-crm
    restart: unless-stopped
    profiles:
      - crm
    networks:
      - internal
      - barber-proxy

volumes:
  postgres-data:

networks:
  internal:
  barber-proxy:
    external: true
